<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ABDrop">
  <!-- 三张堆叠的卡片:与 App 首页的卡片堆叠形态呼应 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e8ecef" />
    </linearGradient>
  </defs>

  <!-- 后层 -->
  <rect x="20" y="10" width="34" height="42" rx="6"
        fill="url(#g)" stroke="#c8d0d8" stroke-width="2"
        transform="rotate(6 37 31)" />
  <!-- 中层 -->
  <rect x="12" y="14" width="34" height="42" rx="6"
        fill="url(#g)" stroke="#b8c2cc" stroke-width="2"
        transform="rotate(-3 29 35)" />
  <!-- 顶层:带记忆强度进度线 -->
  <rect x="8" y="18" width="34" height="42" rx="6"
        fill="#fbfcfd" stroke="#8b97a6" stroke-width="2.5" />
  <rect x="14" y="25" width="22" height="3" rx="1.5" fill="#3fbf7f" />
  <rect x="14" y="34" width="18" height="2.5" rx="1.25" fill="#c2cad3" />
  <rect x="14" y="42" width="21" height="2.5" rx="1.25" fill="#c2cad3" />
  <rect x="14" y="50" width="13" height="2.5" rx="1.25" fill="#c2cad3" />
</svg>
